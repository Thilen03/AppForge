[project]
name = "appforge"
version = "0.5.6"
description = "A library and launcher for AppImages and other standalone Linux applications"
requires-python = ">=3.10"
dependencies = ["PySide6-Essentials>=6.6", "PySquashfsImage>=0.9", "zstandard>=0.22", "certifi>=2023.7"]

[project.scripts]
appforge = "appforge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
appforge = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
